<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: auto; }
        .product-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100px; height: 100px; border-radius: 5px; }
        .product-card h3 { margin: 10px 0; font-size: 18px; }
        .product-card p { color: #2ecc71; font-weight: bold; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn:active { background: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛍️ Mini Shop</h2>
    
    <!-- Product 1 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/100" alt="Product">
        <h3>Smart Watch</h3>
        <p>$20.00</p>
        <button class="btn" onclick="orderProduct('Smart Watch', 20)">Buy Now</button>
    </div>

    <!-- Product 2 -->
    <div class="product-card">
        <img src="https://via.placeholder.com/100" alt="Product">
        <h3>Wireless Headphone</h3>
        <p>$15.00</p>
        <button class="btn" onclick="orderProduct('Headphone', 15)">Buy Now</button>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // অ্যাপটিকে ফুল স্ক্রিন করবে

    function orderProduct(name, price) {
        let data = {
            product_name: name,
            price: price
        };
        // বটের কাছে ডাটা পাঠাবে
        tg.sendData(JSON.stringify(data));
        tg.close(); // অর্ডার শেষে অ্যাপ বন্ধ হবে
    }
</script>

</body>
</html>
