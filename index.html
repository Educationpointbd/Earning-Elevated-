<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Shop & Payment</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #0088cc;
            --bkash: #d12053;
            --nagad: #f7941d;
            --rocket: #8c3494;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .product-card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
        .product-card img { width: 100%; border-radius: 10px; height: 150px; object-fit: cover; }
        .price { font-size: 20px; color: #27ae60; font-weight: bold; margin: 10px 0; }
        .buy-btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Payment Modal */
        #payment-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .method-card { padding: 15px; border-radius: 10px; margin-bottom: 10px; color: white; cursor: pointer; display: flex; justify-content: space-between; }
        .bkash { background: var(--bkash); }
        .nagad { background: var(--nagad); }
        .rocket { background: var(--rocket); }
        .input-group { margin-top: 20px; }
        input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .confirm-btn { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="shop-page">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400" alt="Product">
            <h3>Premium Smart Watch</h3>
            <div class="price">৳ ১৫০০</div>
            <button class="buy-btn" onclick="openPayment('Smart Watch', 1500)">Buy Now</button>
        </div>
    </div>

    <!-- Payment Gateway Section -->
    <div id="payment-modal">
        <h2 style="text-align:center">Checkout</h2>
        <p>পেমেন্ট মেথড সিলেক্ট করুন:</p>
        <div class="method-card bkash" onclick="selectMethod('bKash', '017XXXXXXXX')">bKash (Personal) <span>Select</span></div>
        <div class="method-card nagad" onclick="selectMethod('Nagad', '018XXXXXXXX')">Nagad (Personal) <span>Select</span></div>
        
        <div id="payment-details" style="display:none; background: #eee; padding: 15px; border-radius: 10px; margin-top:15px;">
            <p id="instruction"></p>
            <div class="input-group">
                <label>আপনার বিকাশ/নগদ নাম্বার:</label>
                <input type="text" id="user-number" placeholder="01XXXXXXXXX">
                <label style="margin-top:10px; display:block">ট্রানজেকশন আইডি (TrxID):</label>
                <input type="text" id="trx-id" placeholder="8N7X6Z5W">
            </div>
            <button class="confirm-btn" onclick="submitOrder()">Submit Payment</button>
        </div>
        <button onclick="closePayment()" style="margin-top:20px; background:none; border:none; color:red; width:100%">Cancel</button>
    </div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    let currentOrder = {};

    function openPayment(name, price) {
        currentOrder = { name, price };
        document.getElementById('payment-modal').style.display = 'block';
        document.getElementById('shop-page').style.display = 'none';
    }

    function closePayment() {
        document.getElementById('payment-modal').style.display = 'none';
        document.getElementById('shop-page').style.display = 'block';
    }

    function selectMethod(method, number) {
        currentOrder.method = method;
        document.getElementById('payment-details').style.display = 'block';
        document.getElementById('instruction').innerHTML = `নিচের <b>${method}</b> নাম্বারে <b>৳${currentOrder.price}</b> সেন্ড মানি করুন। <br><br> নাম্বার: <b>${number}</b>`;
    }

    function submitOrder() {
        const userNumber = document.getElementById('user-number').value;
        const trxId = document.getElementById('trx-id').value;

        if(!userNumber || !trxId) {
            alert("সবগুলো তথ্য সঠিকভাবে দিন");
            return;
        }

        const data = {
            product: currentOrder.name,
            price: currentOrder.price,
            method: currentOrder.method,
            sender: userNumber,
            trxid: trxId
        };

        tg.sendData(JSON.stringify(data)); // বটের কাছে ডাটা পাঠানো
        tg.close();
    }
</script>
</body>
</html>
